<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor de Reunião</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <strong>Mentor</strong>
  <span id="timer" class="muted">00:00</span>
  <span class="spacer"></span>
  <button id="btnStart" class="primary">▶ Começar</button>
  <button id="btnStop" class="danger" hidden>■ Encerrar + Ata</button>
</header>
<div id="status" class="status" hidden></div>

<details id="setupBox" open>
  <summary>1. Antes de começar (30s)</summary>
  <div id="kbInfo" class="muted small"></div>
  <label>Tipo de reunião
    <select id="modo">
      <option value="diagnostico">Diagnóstico Comercial (até 90 min)</option>
      <option value="ecossistema">Reunião do Ecossistema (até 60 min)</option>
      <option value="followup">Follow-up / reativação</option>
      <option value="livre">Livre</option>
    </select>
  </label>
  <label>Cliente / participantes
    <input id="comQuem" placeholder="Ex.: Solar Sul — João (sócio), Ana (comercial)">
  </label>
  <label>Objetivo desta reunião
    <input id="objetivo" placeholder="Ex.: validar causa-raiz e sair com microdecisão + data">
  </label>
  <label>Foco comercial
    <input id="foco" placeholder="Ex.: levar para Growth ou composição com Pós-venda">
  </label>
  <label>O que a pré-venda já levantou / suas hipóteses
    <textarea id="notas" rows="3" placeholder="Porte, base instalada, vendas/mês, time, ferramentas, dor registrada…"></textarea>
  </label>
</details>

<section id="coach" class="card urg-baixa" hidden>
  <div class="row"><span id="momento" class="tag"></span><span class="spacer"></span><span id="custo" class="muted small"></span></div>
  <div class="row small muted"><span id="portao"></span></div>
  <div class="label">AGORA</div>
  <div id="proximo" class="big"></div>
  <div id="digaBox" hidden>
    <div class="label">DIGA <button id="btnCopy" class="mini">copiar</button></div>
    <div id="diga" class="say"></div>
  </div>
  <div id="perguntasBox" hidden><div class="label">PERGUNTE</div><ul id="perguntas"></ul></div>
  <div id="alertasBox" hidden><div class="label warn">⚠ ATENÇÃO</div><ul id="alertas"></ul></div>
  <div id="falta_cobrirBox" hidden><div class="label">☐ FALTA COBRIR</div><ul id="falta_cobrir"></ul></div>
</section>

<div class="ask">
  <input id="pedido" placeholder="Pergunte rápido: “quanto fica o Growth anual à vista?”">
  <button id="btnAjuda" class="primary">Me ajuda AGORA</button>
</div>

<details open>
  <summary>🧠 Memória / CRM <span id="memCount" class="muted"></span></summary>
  <ul id="memoria" class="mem"></ul>
</details>

<details>
  <summary>📝 Transcrição ao vivo</summary>
  <div id="transcript" class="transcript"></div>
  <div id="interim" class="muted small"></div>
</details>

<section id="ataBox" class="card" hidden>
  <div class="row"><strong>Ata final</strong><span class="spacer"></span>
    <button id="btnCopyAta" class="mini">copiar</button>
    <button id="btnBaixar" class="mini">baixar .md</button>
  </div>
  <pre id="ata"></pre>
</section>

<footer class="muted small"><a href="options.html" target="_blank">⚙ Configurações</a></footer>
<script type="module" src="sidepanel.bundle.js"></script>
</body>
</html>
