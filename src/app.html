<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Mercado · Inteligência</title>
<meta name="description" content="Inteligência de mercado solar para integradores — dados públicos ANEEL, IBGE e NASA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f7f4ef;--card:#fff;--ink:#16130f;--soft:#6e6a62;--faint:#9a938a;
  --border:#ece6de;--border2:#e6e0d8;--div:#f2ede6;--div2:#f4efe8;
  --or:#ff6a00;--or-d:#e25c00;--tile:#fff1e7;--hover:#fff6ef;
  --blue-bg:#e9f1fb;--blue:#2d6fb8;--red:#d64545;--red-bg:#fdecec;--green:#1f8a4c;--green-bg:#e8f5ee;
  --s1:#ffe2d3;--s2:#ffb27a;--s3:#ff6a00;--s4:#d45500;--s5:#8f3a00;
  --sora:"Sora",system-ui,sans-serif;--man:"Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--man);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
b,strong{font-weight:800}
.hidden{display:none!important}
.muted{color:var(--faint)}

/* ---------- picker ---------- */
.picker{min-height:100vh;background:#16130f;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden}
.picker .glow{position:absolute;width:560px;height:560px;right:-160px;top:-220px;border-radius:50%;background:radial-gradient(circle,#ff6a0055,transparent 65%)}
.pcard{position:relative;background:#fff;border-radius:22px;padding:36px 40px;width:100%;max-width:600px;box-shadow:0 30px 80px #0006}
.logo{display:inline-block;background:#16130f;color:#fff;font-family:var(--sora);font-weight:800;font-size:18px;padding:10px 14px;border-radius:10px}
.logo span,.hlogo span{color:var(--or)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--or);text-transform:uppercase;margin:22px 0 8px}
.ptitle{font-family:var(--sora);font-size:26px;line-height:1.18;margin:0 0 18px;letter-spacing:-.02em}
.ptitle em{font-style:normal;color:var(--or)}
.flabel{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:block}
.inp{width:100%;height:50px;border:1.5px solid var(--border2);border-radius:12px;padding:0 16px;font:600 15px var(--man);color:var(--ink);outline:none;background:#fff}
.inp:focus,.numin:focus{border-color:var(--or)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border2);border-radius:12px;box-shadow:0 16px 38px #00000029;padding:6px;z-index:900;max-height:320px;overflow:auto;min-width:260px}
.sugg div{padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.sugg div:hover,.sugg div.on{background:var(--hover)}
.sugg i{width:7px;height:7px;border-radius:50%;background:var(--or);flex:none}
.sugg small{margin-left:auto;color:var(--faint);font-weight:700;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--border2);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pbtn{border:1.5px solid var(--border2);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
.pbtn b{display:block;font-size:13.5px}
.pbtn span{display:block;font-size:11.5px;color:var(--soft);font-weight:600;margin-top:2px;line-height:1.35}
.pbtn.on{border-color:var(--or);background:var(--hover)}
.pbtn.on b{color:var(--or-d)}
.pactions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--or);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.cta{background:linear-gradient(90deg,#f34524,#f06c1b);color:#fff!important;border:0;border-radius:12px;height:52px;padding:0 26px;font:800 15px var(--man);cursor:pointer;box-shadow:0 10px 24px #f0501f40}
.cta:disabled{opacity:.5;cursor:wait}
.perr{color:var(--red);font-size:13px;font-weight:600;margin-top:6px;min-height:18px}

/* ---------- header ---------- */
.header{background:#fff;border-bottom:1px solid var(--border);min-height:64px;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:1000;flex-wrap:wrap}
.hleft{display:flex;align-items:center;gap:16px;min-width:0}
.hlogo{font-family:var(--sora);font-weight:800;font-size:18px}
.hdiv{width:1px;height:24px;background:var(--border2)}
.crumb{font-family:var(--sora);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{color:var(--or)}
.crumb small{font-family:var(--man);font-size:13px;color:var(--soft);font-weight:700;margin-left:6px}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbtn{height:44px;border:1.5px solid var(--border2);background:#fff;border-radius:11px;padding:0 12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;cursor:pointer;position:relative}
.fbtn:hover,.fbtn.open{border-color:var(--or)}
.fbtn small{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:800;line-height:1}
.fbtn span{font-size:13.5px;font-weight:800;line-height:1.3;white-space:nowrap}
.fbtn span::after{content:" ▾";color:var(--faint);font-size:10px}
.fbtn.act{border-color:#ffc299;background:#fffaf6}
.hbtn{height:44px;border:1.5px solid var(--border2);background:#fff;border-radius:11px;padding:0 14px;cursor:pointer;font-weight:800;font-size:13.5px;white-space:nowrap;position:relative;display:flex;align-items:center}
.hbtn:hover{border-color:var(--or)}
.hbtn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.dd{position:absolute;top:50px;left:0;min-width:260px;background:#fff;border:1px solid var(--border2);border-radius:12px;box-shadow:0 16px 38px #00000029;padding:7px;z-index:1100;cursor:default;text-align:left;color:var(--ink)}
.dd.r{left:auto;right:0}
.ddrow{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
.ddrow:hover{background:var(--hover)}
.ddrow .dot{width:9px;height:9px;border-radius:50%;border:2px solid #d8d0c5;margin-top:4px;flex:none}
.ddrow.on .dot{border-color:var(--or);background:var(--or)}
.ddrow small{display:block;font-weight:600;color:var(--soft);font-size:11.5px;margin-top:1px;white-space:normal}
.ddhead{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
.ddsep{height:1px;background:var(--div);margin:5px 4px}

/* ---------- page ---------- */
.page{max-width:1640px;margin:0 auto;padding:18px 24px 60px}
.snav{position:sticky;top:64px;z-index:900;background:linear-gradient(var(--bg) 80%,#f7f4ef00);padding:12px 0 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.snav button{border:1.5px solid var(--border2);background:#fff;border-radius:999px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.snav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:stretch}
.mapcard{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);min-height:560px;box-shadow:0 12px 30px #0000000d;background:#e9e9e6}
#map{position:absolute;inset:0}
.radiusbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;background:#fff;border:1px solid var(--border);border-radius:14px;padding:9px 14px;box-shadow:0 10px 26px #0000001f;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rlab{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rval{font-family:var(--sora);font-weight:800;font-size:19px;color:var(--or);min-width:76px}
.radiusbar input[type=range]{flex:1;min-width:120px}
.rquick{display:flex;gap:5px}
.rquick button{border:1.5px solid var(--border2);background:#fff;border-radius:8px;padding:4px 8px;font-weight:800;font-size:11.5px;cursor:pointer}
.rquick button.on{border-color:var(--or);color:var(--or-d);background:var(--hover)}
.rsel{height:30px;border:1.5px solid var(--border2);border-radius:8px;font:700 12px var(--man);padding:0 6px;background:#fff}
input[type=range]{accent-color:var(--or);height:22px;cursor:pointer}
.maplegend{position:absolute;top:12px;right:12px;z-index:500;background:#fffffff2;border:1px solid var(--border);border-radius:12px;padding:8px 10px;box-shadow:0 6px 18px #0000001a;font-size:11px;font-weight:700;width:200px}
.maplegend select{width:100%;border:1.5px solid var(--border2);border-radius:8px;height:30px;font:800 12px var(--man);margin:4px 0 6px;background:#fff}
.lscale{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.lscale i{flex:1}
.lends{display:flex;justify-content:space-between;color:var(--soft);margin-top:3px;font-size:10.5px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.kpi .kh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kpi .kh i{width:26px;height:26px;border-radius:8px;background:var(--tile);display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:var(--or);font-size:13px;flex:none}
.kpi .kv{font-family:var(--sora);font-weight:800;font-size:clamp(26px,2.4vw,40px);letter-spacing:-.02em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.kpi .ks{font-size:12.5px;color:var(--soft);font-weight:700;margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.dark{background:#16130f;border-color:#16130f;color:#fff}
.kpi.dark .kh{color:#c9b8a6}.kpi.dark .kh i{background:#2b221a}
.kpi.dark .kv{color:#ff8a33}.kpi.dark .ks{color:#d8ccbf}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.up{background:var(--green-bg);color:var(--green)}.pill.down{background:var(--red-bg);color:var(--red)}.pill.flat{background:var(--div2);color:var(--soft)}
.pill.or{background:var(--tile);color:var(--or-d)}

.cities{background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px 16px;margin-top:14px}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chead h3{font-family:var(--sora);font-size:15px;margin:0}
.chead .sp{flex:1}
.cchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px 5px 8px;border:1.5px solid #ffd9bf;background:#fff8f2;font-size:12.5px;font-weight:800;cursor:pointer;user-select:none}
.cchip i{width:9px;height:9px;border-radius:50%;background:var(--or);flex:none}
.cchip small{color:var(--soft);font-weight:700}
.cchip.sede{background:var(--ink);border-color:var(--ink);color:#fff;cursor:default}.cchip.sede small{color:#cbbfb2}
.cchip.off{background:#fff;border-color:var(--border2);color:var(--faint);text-decoration:line-through}.cchip.off i{background:#d8d1c7}
.cchip.more{border-style:dashed;background:#fff;color:var(--soft)}
.hsearch{position:relative}
.hsearch input{height:36px;width:260px;border:1.5px solid var(--border2);border-radius:10px;padding:0 12px 0 32px;font:600 13px var(--man);outline:none}
.hsearch input:focus{border-color:var(--or)}
.hsearch svg{position:absolute;left:10px;top:11px}
.hsearch .sugg{top:42px}
.btn{height:36px;border-radius:10px;padding:0 13px;font-weight:800;font-size:12.5px;cursor:pointer;border:1.5px solid var(--border2);background:#fff;white-space:nowrap}
.btn:hover{border-color:var(--or)}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.tbl th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:800;text-align:right;padding:7px 8px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
.tbl th:first-child,.tbl th:nth-child(2){text-align:left}
.tbl th.sorted{color:var(--or-d)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--div2);text-align:right;font-weight:700;white-space:nowrap}
.tbl td:nth-child(2){text-align:left}
.tbl td:first-child{text-align:left;width:24px}
.tbl tr.off td{opacity:.42}
.tbl tbody tr:hover td{background:var(--hover)}
input[type=checkbox]{accent-color:var(--or);width:15px;height:15px;cursor:pointer}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--soft)}
.scorebar{display:inline-block;width:40px;height:6px;border-radius:4px;background:var(--div);vertical-align:middle;margin-right:6px;overflow:hidden}
.scorebar b{display:block;height:100%;background:var(--or);border-radius:4px}

.rows{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.row{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px 26px 22px;scroll-margin-top:124px}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.rnum{font-family:var(--sora);font-size:12px;font-weight:800;color:#fff;background:var(--or);border-radius:8px;padding:3px 8px}
.rk{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--or-d)}
.rhead h2{font-family:var(--sora);font-size:22px;margin:0;letter-spacing:-.01em;flex-basis:100%}
.info{display:inline-flex;width:18px;height:18px;border-radius:50%;border:1.5px solid #c9c2b8;color:#a39b90;font-size:10.5px;font-weight:800;align-items:center;justify-content:center;cursor:help;font-style:normal}
.rbody{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:32px;align-items:start}
.bign{font-family:var(--sora);font-size:clamp(38px,3.6vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bign.or{color:var(--or-d)}
.bign.txt{white-space:normal;font-size:clamp(28px,2.4vw,40px);line-height:1.1}
.bigl{font-size:14px;font-weight:700;color:var(--soft);margin-top:8px;line-height:1.45}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.mini{background:var(--div2);border-radius:12px;padding:10px 12px;min-width:0}
.mini .v{font-family:var(--sora);font-size:clamp(15px,1.2vw,19px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.mini .l{font-size:11px;font-weight:700;color:var(--soft);margin-top:2px;line-height:1.3}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{border:1px solid var(--div);background:#fffdfb;border-radius:14px;padding:14px 16px;min-width:0}
.tile .l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.tile .v{font-family:var(--sora);font-weight:800;font-size:26px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--soft);font-weight:700;margin-top:3px}
.tile.hl{background:var(--hover);border-color:#ffd9bf}.tile.hl .v{color:var(--or-d)}
.tile.dark{background:#16130f;border-color:#16130f;color:#fff}.tile.dark .l{color:#c9b8a6}.tile.dark .v{color:#ff8a33}.tile.dark .s{color:#d8ccbf}
.vsub{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}

.vbars{display:flex;align-items:flex-end;gap:3px;height:200px;padding-top:20px;border-bottom:1px solid var(--border)}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;height:100%}
.vval{font-size:11px;font-weight:800;margin-bottom:4px;white-space:nowrap;color:var(--soft)}
.vtrack{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.vbar{width:76%;max-width:44px;border-radius:5px 5px 0 0;background:var(--s3);min-height:2px}
.vcol:hover .vbar{filter:brightness(.88)}
.vbar.lag{background:repeating-linear-gradient(135deg,#ffc299 0 4px,#ffe8d9 4px 8px)}
.vbar.a1{background:var(--s5)}.vbar.a2{background:var(--s3)}.vbar.a3{background:var(--s2)}
.vlabs{display:flex;gap:3px}
.vlabs span{flex:1;text-align:center;font-size:11px;color:var(--faint);font-weight:700;margin-top:6px;white-space:nowrap;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tabs{display:inline-flex;background:var(--div2);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:5px 10px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;color:var(--soft);letter-spacing:0;text-transform:none}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0000001a}
.hbars{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:130px 1fr 86px;align-items:center;gap:12px;font-size:13px;font-weight:700}
.hrow .hl{text-align:right;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow.dim{opacity:.35}
.htrack{height:18px;background:var(--div2);border-radius:5px;overflow:hidden}
.hfill{height:100%;border-radius:5px;background:var(--s3)}
.hv{font-weight:800;white-space:nowrap}
.hv small{color:var(--faint);font-weight:700;margin-left:4px}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ringc{border:1.5px solid var(--div);border-radius:16px;padding:14px;text-align:center}
.ringc.focus{border-color:#ffb27a;background:#fffaf6}
.ring{width:118px;height:118px;border-radius:50%;margin:6px auto 10px;display:flex;align-items:center;justify-content:center}
.ring>div{width:88px;height:88px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:var(--sora);font-size:21px}
.ring small{font-size:9px;color:var(--faint);font-weight:800;letter-spacing:.05em}
.ringc h4{margin:0;font-family:var(--sora);font-size:14px}
.ringc .rv{font-family:var(--sora);font-size:22px;font-weight:800;color:var(--or-d)}
.ringc .rl{font-size:12px;color:var(--soft);font-weight:700}
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding-top:10px}
.timeline div{border-radius:12px;padding:12px 6px;text-align:center;background:var(--div2);font-size:12px;font-weight:800;color:var(--soft);position:relative}
.timeline div b{display:block;font-family:var(--sora);font-size:22px;color:var(--ink)}
.timeline div.now{background:var(--or);color:#fff}.timeline div.now b{color:#fff}
.timeline div.now::after{content:"HOJE";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:9px;letter-spacing:.1em;border-radius:5px;padding:2px 6px}
.timeline div.past{opacity:.5}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 22px}
.slider{margin-bottom:10px}
.slider .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:2px;gap:8px}
.slider .top b{color:var(--ink);font-family:var(--sora);white-space:nowrap}
.slider input{width:100%}
.numin{width:100%;height:40px;border:1.5px solid var(--border2);border-radius:10px;padding:0 12px;font:700 15px var(--man);outline:none}
.ranks{display:flex;flex-direction:column;gap:7px}
.rrow{display:grid;grid-template-columns:26px minmax(120px,190px) 1fr 150px;gap:12px;align-items:center;font-size:13px;font-weight:700}
.rrow .rn{width:24px;height:24px;border-radius:7px;background:var(--div2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--soft)}
.rrow:nth-child(-n+3) .rn{background:var(--or);color:#fff}
.rrow .rc{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rc small{color:var(--faint);font-weight:700;margin-left:4px}
.rrow .rt{height:20px;background:var(--div2);border-radius:5px;overflow:hidden;position:relative}
.rrow .rt b{display:block;height:100%;background:var(--or);border-radius:5px}
.rrow .rt span{position:absolute;right:6px;top:2px;font-size:11.5px;font-weight:800;color:var(--ink)}
.rrow .rx{font-size:12px;color:var(--soft);white-space:nowrap;text-align:right}
.ltbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ltbl th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:800;text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.ltbl td{padding:7px 8px;border-bottom:1px solid var(--div2);font-weight:600}
.ltbl td.r,.ltbl th.r{text-align:right;white-space:nowrap}
.tag{font-size:9px;font-weight:800;letter-spacing:.08em;border-radius:5px;padding:2px 5px;margin-left:6px;text-transform:uppercase;white-space:nowrap;background:var(--blue-bg);color:var(--blue)}
.foot{font-size:11.5px;color:var(--faint);line-height:1.6;padding:14px 4px 0}
.foot b{color:var(--soft)}
.empty{color:var(--faint);font-size:13px;font-weight:600;padding:8px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:26px}

/* ---------- v5: efeitos, explicações, score, venda nova, lead ---------- */
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.vbar{transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.hfill,.rrow .rt b,.sbar i,.segbar i,.cmpbar i{transform-origin:left;animation:growX .8s cubic-bezier(.2,.8,.2,1) both}
.row{animation:fadeUp .5s ease-out both}
.kpi{transition:transform .15s,box-shadow .15s}.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0000000f}
.tile{transition:transform .15s}.tile:hover{transform:translateY(-2px)}
.why{display:flex;gap:10px;align-items:flex-start;background:#fbf8f4;border:1px dashed #e8dccd;border-radius:12px;padding:9px 13px;font-size:13px;color:#5d584f;font-weight:600;line-height:1.5;margin:-4px 0 18px}
.why::before{content:"💡";flex:none}
.why b{color:var(--ink)}
.chap{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--ink);border-radius:6px;padding:3px 8px}
.crit{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.crit span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border:1.5px solid var(--div);border-radius:999px;padding:4px 10px 4px 6px;background:#fff}
.crit i{width:12px;height:12px;border-radius:4px}
.crit small{color:var(--faint);font-weight:700}
.stbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.stbl th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:800;padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.stbl th:nth-child(-n+3){text-align:left}
.stbl td{padding:7px 8px;border-bottom:1px solid var(--div2);text-align:right;font-weight:700;white-space:nowrap}
.stbl td:nth-child(-n+3){text-align:left}
.stbl tr:hover td{background:var(--hover)}
.stbl .rn{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--div2);align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--soft)}
.stbl tr.top3 .rn{background:var(--or);color:#fff}
.stbl .cn{font-weight:800}.stbl .cn small{color:var(--faint);font-weight:700;margin-left:4px}
.sbar{display:flex;height:18px;border-radius:5px;overflow:hidden;gap:2px;min-width:220px;background:var(--div2)}
.sbar i{display:block;height:100%}
.pt{display:inline-flex;align-items:center;gap:5px}
.pt i{width:8px;height:8px;border-radius:3px}
.stot{font-family:var(--sora);font-size:16px;font-weight:800}
.segs{display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:170px 1fr 150px;gap:14px;align-items:center}
.seg .sl{font-weight:800;font-size:13.5px}.seg .sl small{display:block;font-size:11.5px;color:var(--soft);font-weight:700}
.segbar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--div2);position:relative}
.segbar i{display:block;height:100%}
.segbar span{position:absolute;left:10px;top:4px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px #0005}
.seg .sv{text-align:right}.seg .sv b{display:block;font-family:var(--sora);font-size:18px;color:var(--or-d)}.seg .sv small{font-size:11.5px;color:var(--soft);font-weight:700}
.dem{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dem>div{border:1.5px solid var(--div);border-radius:14px;padding:12px 14px;background:#fff}
.dem .dl{font-size:12px;font-weight:800;color:var(--soft)}
.dem .dv{font-family:var(--sora);font-size:24px;font-weight:800;margin:4px 0}
.dem .ds{font-size:11.5px;font-weight:700;color:var(--soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dem .dbar{height:6px;border-radius:4px;background:var(--div2);margin-top:8px;overflow:hidden}.dem .dbar i{display:block;height:100%;background:var(--or);border-radius:4px}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmprow{display:grid;grid-template-columns:110px 1fr 90px;gap:12px;align-items:center;font-size:13px;font-weight:800}
.cmpbar{height:22px;background:var(--div2);border-radius:6px;overflow:hidden}
.cmpbar i{display:block;height:100%;border-radius:6px}
.donut{position:relative;width:170px;height:170px;margin:0 auto}
.donut svg{transform:rotate(-90deg)}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .dc b{font-family:var(--sora);font-size:28px;color:var(--or-d)}.donut .dc small{font-size:11px;font-weight:800;color:var(--soft)}
.donut circle.arc{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.funnel{display:flex;flex-direction:column;align-items:center;gap:6px}
.funnel>div{border-radius:10px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;font-weight:800;color:#fff;animation:fadeUp .5s both}
.funnel b{font-family:var(--sora);font-size:18px}
.lgrid{display:grid;grid-template-columns:200px 1fr 1fr;gap:24px;align-items:center}
.opp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.opp>div{border-radius:14px;padding:14px 16px;border:1.5px solid var(--div)}
.opp .ol{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.opp .ov{font-family:var(--sora);font-size:24px;font-weight:800;margin:6px 0 2px}
.opp .os{font-size:12px;font-weight:700;color:var(--soft)}
.opp .a{background:#fff6ef;border-color:#ffd9bf}.opp .a .ov{color:var(--or-d)}
.opp .b{background:#eef4fc;border-color:#cfe0f5}.opp .b .ov{color:var(--blue)}
.opp .c{background:#16130f;border-color:#16130f;color:#fff}.opp .c .ov{color:#ff8a33}.opp .c .ol,.opp .c .os{color:#cbbfb2}
.lightcard{background:#fff;color:var(--ink);border-radius:16px;padding:16px}
.lf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lf .full{grid-column:1/-1}
.tgl{display:flex;align-items:center;gap:10px;background:#231d18;border:1px solid #3a3027;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;margin-top:10px}
.tgl input{width:18px;height:18px}
@media (max-width:1180px){.lgrid{grid-template-columns:1fr}.opp{grid-template-columns:1fr}}
@media (max-width:760px){.seg{grid-template-columns:1fr}.seg .sv{text-align:left}.sbar{min-width:140px}}
@media print{.row,.vbar,.hfill,.sbar i,.segbar i{animation:none!important}}

/* fundos de destaque */
.rbody>div:first-child{background:linear-gradient(160deg,#fff7f0,#fff 70%);border:1px solid #ffe6d4;border-radius:16px;padding:18px}
.rbody>div:last-child{background:#fbf9f6;border:1px solid var(--div);border-radius:16px;padding:18px}
.rbody .mini{background:#fff;border:1px solid var(--div)}
.rhead h2{background:linear-gradient(transparent 62%,#ffe2d3 62%);display:inline;flex-basis:auto;padding:0 2px}
.rhead{row-gap:8px}.rhead h2+*{flex-basis:100%}
.kpi{background:linear-gradient(160deg,#fff,#fffaf5)}
.kpi .kv{color:var(--ink)}
.cities{background:linear-gradient(90deg,#fff,#fffaf6)}
/* mapa */
.mlabel{background:#16130f;color:#fff;border-radius:8px;padding:3px 8px;font:800 11.5px var(--man);white-space:nowrap;box-shadow:0 4px 12px #0003;border:1.5px solid #fff;transform:translate(-50%,-150%);display:inline-block}
.mlabel small{color:#ffb27a;font-weight:800;margin-left:4px}
.mlabel.sede{background:#ff6a00}
.mlabel.sede small{color:#fff}
.leaflet-tooltip.mtip{background:#16130f;color:#fff;border:0;border-radius:10px;padding:8px 11px;font:600 12px var(--man);box-shadow:0 10px 26px #0004}
.leaflet-tooltip.mtip b{color:#ff9a4d;font-family:var(--sora)}
.leaflet-tooltip.mtip::before{display:none}
.maptgl{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.maptgl label{display:flex;gap:4px;align-items:center;font-size:11px;font-weight:800;color:var(--soft);cursor:pointer}
.maptgl input{width:13px;height:13px}
.lticks{display:flex;justify-content:space-between;font-size:10px;color:var(--soft);font-weight:700;margin-top:2px}

/* termômetro */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.gauge{background:#fff;border:1.5px solid var(--div);border-radius:16px;padding:14px 16px}
.gauge .gt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.gauge .gs{display:flex;align-items:center;gap:8px;font-family:var(--sora);font-size:19px;font-weight:800;margin:6px 0 10px}
.gauge .gs i{font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;position:relative;height:10px}
.meter span{border-radius:3px;opacity:.28}.meter span.on{opacity:1}
.gauge .gd{font-size:12.5px;font-weight:700;color:var(--soft);margin-top:10px;line-height:1.4}
.gauge .gd b{color:var(--ink)}
.st0 .gs{color:#b93a3a}.st0 .gs i{background:#d64545}
.st1 .gs{color:#a86b00}.st1 .gs i{background:#e0a100}
.st2 .gs{color:#177a43}.st2 .gs i{background:#1f8a4c}
.verdict{border-radius:16px;padding:18px;color:#fff}
.verdict .vi{font-size:34px}
.verdict h3{font-family:var(--sora);font-size:22px;margin:8px 0 6px;line-height:1.2}
.verdict p{margin:0;font-size:13.5px;font-weight:600;opacity:.92;line-height:1.5}
.v2{background:linear-gradient(150deg,#1f8a4c,#15693a)}.v1{background:linear-gradient(150deg,#d88f00,#b36f00)}.v0{background:linear-gradient(150deg,#d64545,#a83131)}
.metachk{border-radius:14px;padding:14px 16px;margin-top:14px;display:flex;gap:12px;align-items:flex-start;font-size:13.5px;font-weight:600;line-height:1.5}
.metachk .mi{font-size:22px}
.metachk b{font-family:var(--sora)}
.metachk.st2{background:#e8f5ee;color:#14532d}.metachk.st1{background:#fff4dc;color:#6b4700}.metachk.st0{background:#fdecec;color:#7f1d1d}

/* funil reverso + canais */
.rf{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.rf-funnel{display:flex;flex-direction:column;align-items:center;gap:4px}
.rf-step{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;color:#fff;font-weight:800;animation:fadeUp .5s both;min-width:0}
.rf-step:nth-child(1){background:#8f3a00}.rf-step:nth-child(3){background:#c24f00}.rf-step:nth-child(5){background:#ff6a00}.rf-step:nth-child(7){background:#16130f}
.rf-step .ri{font-size:18px}.rf-step .rl{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-step .rv{font-family:var(--sora);font-size:22px}
.rf-step .rh{font-size:11px;font-weight:800;background:#ffffff26;border-radius:999px;padding:2px 8px;white-space:nowrap}
.rf-op{font-size:11.5px;font-weight:800;color:var(--soft);background:#fff;border:1px dashed #e0d4c6;border-radius:999px;padding:2px 10px}
.rf-note{font-size:11.5px;color:var(--faint);font-weight:700;margin-top:6px}
.rf-side{display:flex;flex-direction:column;gap:10px}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.chn{background:#fff;border:1.5px solid var(--div);border-radius:14px;padding:12px 14px;transition:transform .15s}
.chn:hover{transform:translateY(-2px);box-shadow:0 10px 22px #0000000f}
.chn .cn{font-size:12.5px;font-weight:800;padding-right:18px}
.chn .cv{font-family:var(--sora);font-size:24px;font-weight:800;margin:6px 0 2px}.chn .cv small{font-size:11px;color:var(--soft);font-family:var(--man)}
.chn .cr{font-size:12px;color:var(--soft);font-weight:700}.chn .cr b{color:var(--ink)}
.chn .cp{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chn .cp .pill{font-size:10.5px}
.chn .cpub{font-size:11px;color:var(--faint);font-weight:700;margin-top:8px;border-top:1px solid var(--div);padding-top:6px}.chn .cpub span{color:var(--ink);font-weight:800}
@media (max-width:1180px){.rf{grid-template-columns:1fr}}
.note{font-size:12px;color:var(--soft);font-weight:600;line-height:1.5;margin-top:12px}.note b{color:var(--ink)}
/* ---------- closer page ---------- */
.closer{min-height:100vh;background:#14110e;color:#f4efe8;padding:0 0 60px}
.chdr{position:sticky;top:0;z-index:100;background:#14110e;border-bottom:1px solid #2b241d;padding:14px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chdr .hlogo{color:#fff}
.chdr .ct{font-family:var(--sora);font-size:17px;font-weight:700}
.chdr .ct span{color:#ff8a33}
.chdr .warn{font-size:12px;font-weight:800;color:#ffb27a;background:#2b1f14;border:1px solid #4a3521;border-radius:999px;padding:5px 11px}
.chdr .sync{margin-left:auto;font-size:12px;font-weight:700;color:#a89a8b}
.cwrap>div{min-width:0}
.cwrap{max-width:1500px;margin:0 auto;padding:22px 28px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:22px;align-items:start}
.cbox{background:#1d1814;border:1px solid #2e261f;border-radius:18px;padding:18px 20px;margin-bottom:16px}
.cbox h3{font-family:var(--sora);font-size:15px;margin:0 0 12px;color:#fff;display:flex;align-items:center;gap:8px}
.cbox h3 small{font-family:var(--man);font-size:12px;color:#a89a8b;font-weight:700}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-top:1px solid #2e261f}
.step:first-of-type{border-top:0;padding-top:0}
.step .sn{width:30px;height:30px;border-radius:9px;background:#ff6a00;color:#fff;font-family:var(--sora);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.step h4{margin:3px 0 6px;font-size:14px;color:#fff;font-family:var(--sora)}
.step .say{font-size:14.5px;line-height:1.6;color:#e8ddd2;background:#231d18;border-left:3px solid #ff6a00;border-radius:4px 10px 10px 4px;padding:9px 12px}
.step .say b{color:#ff9a4d}
.step .ask{margin-top:7px;font-size:13px;color:#cbbfb2;font-weight:600}
.step .ask b{color:#fff}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qs li{font-size:13.5px;color:#e8ddd2;font-weight:600;padding:8px 10px;background:#231d18;border-radius:10px}
.qs li::before{content:"?";display:inline-flex;width:18px;height:18px;border-radius:50%;background:#ff6a00;color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:8px}
.cheat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cheat div{background:#231d18;border-radius:10px;padding:9px 11px}
.cheat b{display:block;font-family:var(--sora);font-size:18px;color:#ff8a33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cheat span{font-size:11.5px;color:#a89a8b;font-weight:700}
.obj{border-top:1px solid #2e261f;padding:10px 0}
.obj:first-of-type{border-top:0;padding-top:0}
.obj p{margin:0;font-size:13px;font-weight:800;color:#fff}
.obj p::before{content:"“";color:#ff8a33}
.obj p::after{content:"”";color:#ff8a33}
.obj div{font-size:13px;color:#cbbfb2;line-height:1.55;margin-top:4px;font-weight:600}
.obj div b{color:#ff9a4d}
.closer .numin{background:#231d18;border-color:#3a3027;color:#fff}
.closer .flabel{color:#a89a8b}
.closer .btn{background:#231d18;border-color:#3a3027;color:#fff}
.closer .btn.pri{background:#ff6a00;border-color:#ff6a00}
.closer .ltbl th{color:#a89a8b;border-color:#2e261f}
.closer .ltbl td{border-color:#2e261f;color:#e8ddd2}
.closer .tiles .tile{background:#231d18;border-color:#2e261f}.closer .tile .l{color:#a89a8b}.closer .tile .v{color:#ff8a33}.closer .tile .s{color:#cbbfb2}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}
.closer .lgrid{grid-template-columns:1fr;gap:16px}

.closer .lightcard .tile.hl{background:var(--hover)}.closer .lightcard .tile.hl .v{color:var(--or-d)}
.closer .lightcard .tile.dark{background:#16130f}.closer .lightcard .tile.dark .v{color:#ff8a33}.closer .lightcard .tile.dark .l,.closer .lightcard .tile.dark .s{color:#cbbfb2}
.closer .lightcard .gauges{grid-template-columns:1fr 1fr}

#tip{position:fixed;z-index:6000;pointer-events:none;background:#16130f;color:#fff;border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:600;line-height:1.5;max-width:340px;border:1px solid #3a3027;box-shadow:0 10px 26px #0000003d;opacity:0;left:-999px;top:-999px}
#tip b{color:#ff9a4d}
#tip .tt{display:block;font-family:var(--sora);font-size:13.5px;color:#fff;margin-bottom:4px}
#tip .tc{display:block;margin-top:7px;padding:6px 8px;background:#2b221a;border-radius:8px;font-size:11.5px;color:#e8ddd2}
#tip .ts{display:block;margin-top:6px;font-size:10.5px;color:#a89a8b;font-weight:700}

function region(){
  const s=R[S.sel],out=[],seen=new Set(),lim=S.radius/100+0.5;
  for(const r of R){
    if(r===s){ out.push({r,d:0,sede:true}); seen.add(r); continue; }
    if(Math.abs(r[3]-s[3])>lim) continue;
    const d=hav(s,r);
    if(d<=S.radius&&met(r).n>=S.minN){ out.push({r,d}); seen.add(r); }
  }
  for(const ib of S.extra){ const r=R[byIbge.get(ib)]; if(r&&!seen.has(r)){ out.push({r,d:hav(s,r),extra:true}); seen.add(r); } }
  out.forEach(o=>o.on=o.sede||!S.ex.has(o.r[0]));
  const on=out.filter(o=>o.on),w=P().w,bv=z=>S.persona==='inv'?z.kw:z.n;
  const mx=f=>Math.max(1e-9,...on.map(o=>f(met(o.r))));
  const mN=mx(bv),mR=mx(z=>z.ritmo),mS=mx(z=>z.space),mO=mx(z=>z.old);
  for(const o of out){ const z=met(o.r),g=z.growth==null?0.33:clamp((z.growth+0.5)/1.5,0,1);
    const raw={n:Math.sqrt(bv(z)/mN),r:Math.sqrt(z.ritmo/mR),g,s:Math.sqrt(z.space/mS),o:Math.sqrt(z.old/mO)};
    o.parts={}; let t=0; for(const [k] of CRIT){ const v=Math.round(100*(w[k]||0)*clamp(raw[k]||0,0,1)); o.parts[k]=v; t+=v; }
    o.score=clamp(t,0,100); }
  return out;
}

function search(q,lim=8){
  q=norm(q); if(q.length<2) return [];
  const parts=q.split(' '),last=parts[parts.length-1],uf=last.length===2&&parts.length>1?last:null,qq=uf?parts.slice(0,-1).join(' '):q;
  const a=[],b=[];
  for(const r of R){ if(uf&&r[2].toLowerCase()!==uf) continue; if(r.k.startsWith(qq)) a.push(r); else if(r.k.includes(qq)) b.push(r); }
  a.sort((x,y)=>totalN(y)-totalN(x)); b.sort((x,y)=>totalN(y)-totalN(x));
  return a.concat(b).slice(0,lim);
}

function vbars(items,opt={}){
  const mx=Math.max(1,...items.map(i=>i.v)),every=opt.every||1,last=items.length-1;
  return `<div class="vbars" style="height:${opt.h||200}px">${items.map(i=>`<div class="vcol" data-tip="${esc(i.tip)}"><div class="vval">${kShort(i.v)}</div><div class="vtrack"><div class="vbar ${i.cls||''}" style="height:${Math.max(1.5,i.v/mx*100)}%"></div></div></div>`).join('')}</div>
  <div class="vlabs">${items.map((i,k)=>`<span>${(last-k)%every===0?i.label:''}</span>`).join('')}</div>`;
}
function hbars(rows,colorFn){ const mx=Math.max(1,...rows.map(r=>r.v)),tot=rows.reduce((s,r)=>s+(r.dim?0:r.v),0)||1;
  return `<div class="hbars">${rows.map((r,i)=>`<div class="hrow ${r.dim?'dim':''}" data-tip="${esc(r.tip||'')}"><span class="hl">${r.label}</span><div class="htrack"><div class="hfill" style="width:${r.v?Math.max(1.5,r.v/mx*100):0}%;background:${colorFn?colorFn(i):SEQ[2]}"></div></div><span class="hv">${kShort(r.v)}<small>${r.dim?'':pct(r.v/tot,0)}</small></span></div>`).join('')}</div>`; }
const ring=(p,lab)=>{ const d=clamp(p*100,0,100); return `<div class="ring" style="background:conic-gradient(#ff6a00 ${Math.max(d,0.8)*3.6}deg,#f2eae0 0deg)"><div><b>${pct(p)}</b><small>${lab}</small></div></div>`; };
function yearsItems(A){
  const out=[];
  for(let y=2015;y<=2026;y++){ const v=y===2015?sum(A.y,0,2015-Y0):A.y[y-Y0];
    out.push({v,label:y===2015?'≤15':"'"+String(y).slice(2),cls:y<=S.oldY?'a1':y<=2024?'a2':'a3',tip:`<b>${y===2015?'Até 2015':y}</b>: ${fmt(v)} usinas${y===2026?' · ano em andamento':''}`}); }
  return out;
}
function monthsItems(A,n=24){
  const off=M.length-n; return M.slice(off).map((m,i)=>{ const k=i+off,lag=k>ST; return {v:A.m[k],label:mLabel(m),cls:lag?'lag':'',tip:`<b>${mLabel(m)}</b>: ${fmt(A.m[k])} usinas${lag?'<br>ANEEL ainda registrando':''}`}; });
}
const rings3=A=>{ const f=P().space; return `<div class="rings">${[['casa','⌂ Casas próprias',A.casaP?A.c[0]/A.casaP:0,A.semCasa,A.casaP],['emp','▦ Empresas',A.emp?(A.c[1]+A.c[3])/A.emp:0,A.semEmp,A.emp],['agro','❀ Propriedades rurais',A.agro?A.c[2]/A.agro:0,A.semAgro,A.agro]]
  .map(([k,t,pp,nn,tt])=>`<div class="ringc ${f===k?'focus':''}" data-tip="${esc(TT(t.replace(/^\S+ /,''),`${pct(pp)} já têm solar. <b>${fmt(nn)}</b> ainda não têm, de ${fmt(tt)} no total.`,'usinas da classe ÷ total do público',k==='casa'?'IBGE Censo 2022 (casas próprias)':k==='emp'?'IBGE CEMPRE (empresas)':'IBGE Censo Agro (propriedades)'))}"><h4>${t}</h4>${ring(pp,'COM SOLAR')}<div class="rv">${fmt(nn)}</div><div class="rl">sem solar · de ${kShort(tt)}</div></div>`).join('')}</div>`; };
const fioB=()=>`<div class="timeline">${FIOB_STEPS.map(([y,v])=>`<div class="${y<2026?'past':y===2026?'now':''}"><b>${v}%</b>${y}</div>`).join('')}</div>`;
const SL_FMT={cap:v=>v+'%',ticket:v=>'R$ '+v,clean:v=>'R$ '+fmt(v),cleanPct:v=>v+'%',price:v=>'R$ '+fmt(v)};
const slider=(k,l,min,max,step,v)=>`<div class="slider"><div class="top"><label for="sl_${k}">${l}</label><b id="sv_${k}">${SL_FMT[k](v)}</b></div><input id="sl_${k}" type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;

function closerScript(){
  const A=AG,C=S.calc,co=calcOut(A),sp=spaceInfo(A),pb=payback(A),s=R[S.sel],p=P();
  const dayLoss=dayLossOf(A),iu=+C.intU||0,im=+C.intM||0;
  const best=LIST.filter(o=>o.on&&!o.sede).sort((a,b)=>b.score-a.score)[0];
  const steps=[];
  steps.push(['Abertura: o tamanho do mercado',`“Na região de <b>${esc(s[1])}</b> já são <b>${fmt(A.n)} usinas</b> instaladas, <b>${kwpF(A.kw)}</b>. Todo mês entram <b>${fmt1(A.ritmo)}</b> novas — somando você e todos os concorrentes.”`,`Pergunte: <b>quantas dessas são suas?</b>`]);
  steps.push(['Base antiga = cliente órfão',`“<b>${fmt(A.old)} usinas (${A.n?pct(A.old/A.n,0):'—'})</b> foram instaladas até ${S.oldY}. Muita empresa daquela época fechou. Quantos desses clientes ainda têm alguém olhando a usina?”`,`Gancho: <b>com o login do portal do inversor</b>, o cliente órfão entra na carteira sem falar com o integrador antigo.`]);
  if(A.growth!=null&&A.growth<=-0.15) steps.push(['Venda nova caindo',`“A venda nova na região <b>caiu ${pct(-A.growth,0)}</b> em 12 meses. Quem depende só de venda nova vai sofrer — a receita tem que vir de <b>quem já comprou</b>.”`,`Pergunte: <b>como ficou o seu volume de vendas este ano?</b>`]);
  else if(A.growth!=null&&A.growth>=0.15) steps.push(['Mercado crescendo',`“O mercado <b>cresceu ${pct(A.growth,0)}</b> em 12 meses. Cada venda nova vira mais um cliente para acompanhar — o pós-venda precisa escalar junto.”`,`Pergunte: <b>quem cuida hoje das usinas depois da instalação?</b>`]);
  else steps.push(['Mercado estável',`“O ritmo está estável em <b>${fmt1(A.ritmo)} usinas/mês</b>. Para crescer sem depender de mais venda, o caminho é faturar com a base.”`,`Pergunte: <b>quanto da sua receita hoje é recorrente?</b>`]);
  steps.push(['Usina parada = dinheiro perdido',`“A região economiza <b>${money(A.econ)}/mês</b> com solar. Uma usina média parada custa <b>${moneyFull(dayLoss)} por dia</b> ao cliente. Se 5% estiverem paradas, são <b>${money(A.econ*0.05)}/mês</b> — e a primeira ligação é para você.”`,`Pergunte: <b>como você descobre hoje que uma usina parou?</b>`]);
  steps.push(['Receita recorrente',`“Com <b>${C.cap}% da base</b> num plano de <b>${moneyFull(C.ticket)}/mês</b>: <b>${fmt(co.cli)} clientes</b> e <b>${money(co.mrr)}/mês</b>. Cada 1% da base são <b>${money(A.n/100*C.ticket)}/mês</b>. Só com as usinas antigas: <b>${money(co.oldMrr)}/mês</b>.”`,`Mostre a linha <b>Receita</b> e mexa no % ao vivo.`]);
  if(A.reaj!=null) steps.push(['Urgência (para o cliente final dele)',`“A conta subiu <b>${plusPct(A.reaj)}</b> em 12 meses e o Fio B vai de <b>60% hoje para 90% em 2028</b>. Payback estimado: <b>${pb.years?fmt1(pb.years)+' anos':'—'}</b>.”`,`Use para mostrar que o <b>mercado de venda nova continua</b>.`]);
  const angle={res:`“Ainda há <b>${fmt(A.semCasa)} casas próprias sem solar</b> — só ${A.casaP?pct(A.c[0]/A.casaP):'—'} já têm.”`,
    emp:`“São <b>${fmt(A.pj)} usinas de empresas</b> e <b>${fmt(A.ga)} em média tensão</b>. Contrato de O&amp;M B2B tem ticket maior e renova todo ano.”`,
    agro:`“A lavoura da região produz <b>${money(A.pam*1000)}/ano</b> e ainda há <b>${fmt(A.semAgro)} propriedades rurais sem solar</b>.”`,
    inv:`“São <b>${fmt(A.remote)} usinas em autoconsumo remoto/compartilhada</b> e <b>${fmt(A.mini)} acima de 75 kW</b> — ativo de investidor exige monitoramento profissional.”`,
    om:`“O mercado de limpeza da região é de <b>${money(A.n*C.clean)}/ano</b> (1 visita por usina a ${moneyFull(C.clean)}).”`,
    todos:`“Ainda há <b>${fmt(sp.n)} ${sp.label}</b> — o mercado está longe de saturar.”`}[S.persona];
  steps.push([`Ângulo do perfil: ${p.label}`,angle,best?`Cidade vizinha para citar: <b>${esc(best.r[1])}</b> (${fmt(best.d)} km, ${fmt(met(best.r).n)} usinas, score ${best.score}).`:'' ]);

  if(false) steps.push(['Onde ele está',`“Você tem <b>${pct(iu/A.n)}</b> da base da região — <b>${fmt(Math.max(0,A.n-iu))} usinas são de outros integradores</b>${im>0&&A.ritmo?` e você faz <b>${pct(im/A.ritmo,0)}</b> das novas conexões`:''}. Com 30% da sua carteira no plano: <b>${money(iu*C.ticket*0.3)}/mês</b>.”`,'']);
  steps.push(['Próximo passo',`“O primeiro passo é importar a sua carteira pelo acesso master dos portais e separar as usinas com baixa performance e os clientes órfãos. Em seguida, montamos o plano de pós-venda.”`,`Feche data para a <b>importação da base</b>.`]);
  return steps;
}

     ${steps.map(([t,sy,ask],i)=>`<div class="step"><div class="sn">${i+1}</div><div><h4>${t}</h4><div class="say">${sy}</div>${ask?`<div class="ask">${ask}</div>`:''}</div></div>`).join('')}</div>
    <div class="cbox"><h3>Objeções e respostas</h3>
     <div class="obj"><p>Não tenho tempo nem equipe para pós-venda</p><div>O acompanhamento é remoto. Comece só pelas <b>${fmt(A.old)} usinas antigas</b> da região e pelos clientes com baixa performance — é onde está a receita mais rápida.</div></div>
     <div class="obj"><p>Cliente não paga por monitoramento</p><div>Venda a economia, não o app: a usina média parada custa <b>${moneyFull(dayLoss)}/dia</b>. O plano de ${moneyFull(C.ticket)}/mês equivale a <b>${fmt1(daysPay)} dia(s)</b> de usina parada.</div></div>
     <div class="obj"><p>O cliente já tem o app do inversor</p><div>O app mostra geração, mas não avisa ninguém nem gera atendimento. O relatório enviado por você é a <b>prova social</b> que gera indicação.</div></div>
     <div class="obj"><p>Meu foco é venda nova</p><div>A venda nova na região está ${A.growth!=null?`<b>${gtxt(A.growth)}</b>`:'estável'} em 12 meses. Cada <b>1% da base</b> são <b>${money(A.n/100*C.ticket)}/mês</b> recorrentes, e cliente acompanhado indica e amplia.</div></div>
    </div>
    <div class="cbox"><h3>Maiores usinas de empresas <small>prospecção B2B · ${tops.length} de ${A.top.length}</small></h3>
     ${tops.length?`<div class="tscroll"><table class="ltbl"><thead><tr><th>Empresa</th><th>Cidade</th><th class="r">Potência</th><th>Classe</th><th class="r">Desde</th><th>Modalidade</th></tr></thead><tbody>${tops.map(t=>`<tr><td><b>${esc(t[0])}</b></td><td>${esc(t[6][1])}</td><td class="r">${kwF(t[1])}</td><td>${CLASSES[t[2]]}${t[4]&&t[4][0]==='A'?'<span class="tag">'+esc(t[4])+'</span>':''}</td><td class="r">${t[3]}</td><td>${MODMAP[t[5]]||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nenhuma usina PJ ≥ 20 kW.</p>'}
    </div>
   </div>
   <div>
    <div class="cbox"><h3>Lead atual <small>preencha durante a conversa</small></h3>
     <div class="lf"><div class="full"><label class="flabel" for="cLeadName">Nome da empresa</label><input class="numin" id="cLeadName" placeholder="ex.: Solar Mossoró" value="${esc(C.leadName||'')}"></div>
      <div><label class="flabel" for="cIntU">Usinas instaladas (total)</label><input class="numin" id="cIntU" inputmode="numeric" placeholder="ex.: 500" value="${esc(C.intU)}"></div>
      <div><label class="flabel" for="cIntM">Vendas por mês hoje</label><input class="numin" id="cIntM" inputmode="numeric" placeholder="ex.: 10" value="${esc(C.intM)}"></div>
      <div class="full"><label class="flabel" for="cMeta">Meta de vendas/mês</label><input class="numin" id="cMeta" inputmode="numeric" placeholder="ex.: 20" value="${esc(C.meta)}"></div>
      <div><label class="flabel" for="cQual">Lead → qualificado (%)</label><input class="numin" id="cQual" inputmode="numeric" value="${esc(C.qual)}"></div>
      <div><label class="flabel" for="cShowr">Qualificado → visita (%)</label><input class="numin" id="cShowr" inputmode="numeric" value="${esc(C.showr)}"></div>
      <div><label class="flabel" for="cClose">Visita → venda (%)</label><input class="numin" id="cClose" inputmode="numeric" value="${esc(C.close)}"></div>
      <div><label class="flabel" for="cSdr">Reuniões por SDR/mês</label><input class="numin" id="cSdr" inputmode="numeric" value="${esc(C.sdrCap)}"></div></div>
     <label class="tgl"><input type="checkbox" id="cShow" ${C.showLead?'checked':''}> Mostrar “Sua empresa no mercado” na tela do cliente</label>
     <div class="lightcard" style="margin-top:12px">${leadViz(A)}</div>
     <ul class="qs" style="margin-top:12px"><li>Quantas usinas você já instalou? Quantas vende por mês?</li><li>De onde vêm seus leads hoje? Quantos chegam por mês?</li><li>Quanto das vendas vem de indicação?</li><li>Quem cuida das usinas depois da instalação?</li><li>Quantos clientes de outro integrador já te procuraram?</li></ul>
    </div>
    <div class="cbox"><h3>Gargalo → solução SolarZ <small>o que oferecer</small></h3>${solutionsHtml(A)}</div>
    <div class="cbox"><h3>Funil Reverso <small>${esc(targetInfo(A).label)}</small></h3><div class="lightcard">${rfHtml(A,targetInfo(A))}</div></div>
    <div class="cbox"><h3>Termômetro <small>veredito da região</small></h3><div class="lightcard"><div class="verdict v${diagnose(A).v}" style="margin-bottom:12px"><div class="vi">${diagnose(A).V[0]}</div><h3>${diagnose(A).V[1]}</h3><p>${diagnose(A).V[2]}</p></div>${gaugesHtml(diagnose(A))}</div></div>
    <div class="cbox"><h3>Cola de números</h3><div class="cheat">${cheat.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div></div>
    <div class="cbox"><h3>Copiar para depois</h3><div class="cbtns">
      <button class="btn pri" data-cc="pitch">💬 Resumo WhatsApp</button><button class="btn" data-cc="table">📋 Tabela de cidades</button><button class="btn" data-cc="pj">🏢 Lista de empresas</button></div></div>
    <div class="cbox"><h3>Ranking completo <small>score do perfil ${p.label}</small></h3>
     <div class="tscroll"><table class="ltbl"><thead><tr><th>#</th><th>Cidade</th><th class="r">Usinas</th><th class="r">Novas/mês</th><th class="r">Score</th></tr></thead><tbody>${rk.slice(0,15).map((o,i)=>{ const z=met(o.r); return `<tr><td>${i+1}</td><td><b>${esc(o.r[1])}</b></td><td class="r">${fmt(z.n)}</td><td class="r">${fmt1(z.ritmo)}</td><td class="r">${o.score}</td></tr>`; }).join('')}</tbody></table></div></div>
   </div>
  </div>`;
}
function updateCShare(){
  const A=AG,C=S.calc,el=$('cShare'); if(!el) return; const iu=+C.intU||0,im=+C.intM||0;
  el.innerHTML=(iu||im)?`<div class="tiles">${tile('Fatia da base',A.n&&iu?pct(iu/A.n):'—',`${kShort(Math.max(0,A.n-iu))} de outros`)}${tile('Fatia das vendas',A.ritmo&&im?pct(im/A.ritmo,0):'—',`${fmt1(Math.max(0,A.ritmo-im))}/mês com outros`)}${tile('Receita da base dele',iu?money(iu*C.ticket*0.3):'—','/mês com 30% no plano')}</div>`:'';
}
function pitchLines(){
  const A=AG,C=S.calc,co=calcOut(A),sp=spaceInfo(A),pb=payback(A),L=[];
  L.push(`*${fmt(A.n)} usinas* instaladas na região (${kwpF(A.kw)})`);
  L.push(`*${fmt1(A.ritmo)} novas usinas/mês* · ${gtxt(A.growth)} em 12 meses`);
  L.push(`*${fmt(A.old)} usinas* conectadas até ${S.oldY} (${A.n?pct(A.old/A.n,0):'—'} da base)`);
  if(sp.tot) L.push(`*${fmt(sp.n)} ${sp.label}* · só ${pct(sp.has/sp.tot)} já têm`);
  if(A.reaj!=null) L.push(`Conta de luz *${plusPct(A.reaj)}* em 12 meses · payback ~${pb.years?fmt1(pb.years):'—'} anos`);
  L.push(`A base gera *${money(A.econ)}/mês* de economia · usina parada custa ${moneyFull(dayLossOf(A))}/dia`);
  L.push(`${C.cap}% da base × ${moneyFull(C.ticket)}/mês = *${money(co.mrr)}/mês* recorrentes`);
  return L;
}
const LEADF={cLeadName:'leadName',cIntU:'intU',cIntM:'intM',cMeta:'meta',cQual:'qual',cShowr:'showr',cClose:'close',cSdr:'sdrCap'};
$('closer').addEventListener('change',e=>{ if(e.target.id==='cShow'){ S.calc.showLead=e.target.checked; saveCalc(); toast(e.target.checked?'Aparecendo na tela do cliente':'Oculto da tela do cliente'); } });
$('closer').addEventListener('input',e=>{
  const key=LEADF[e.target.id];
  if(key){ if(key!=='leadName') e.target.value=e.target.value.replace(/[^\d]/g,''); S.calc[key]=e.target.value; saveCalc();
    const y=scrollY; const f=e.target.id,pos=e.target.selectionStart; renderCloser(); scrollTo(0,y); const el=$(f); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(err){} } }
});
$('closer').addEventListener('click',e=>{
  const b=e.target.closest('[data-cc]'); if(!b) return; const k=b.dataset.cc;
  if(k==='pitch') copy(`*Mercado solar — ${areaName()}*\n\n`+pitchLines().map(t=>'• '+t).join('\n')+`\n\nFonte: ANEEL, IBGE e NASA (dados públicos).`,'Resumo copiado — cole no WhatsApp');
  if(k==='table'){ const rows=LIST.filter(o=>o.on).sort((a,b)=>b.score-a.score).map(o=>{ const z=met(o.r); return [o.r[1]+'/'+o.r[2],o.sede?0:Math.round(o.d),z.n,Math.round(z.kw),z.ritmo.toFixed(1).replace('.',','),z.growth==null?'':Math.round(z.growth*100)+'%',z.old,z.space,o.score].join('\t'); });
    copy(['Cidade\tkm\tUsinas\tkW\tNovas/mês\tCresc. 12m\tAntigas\t'+spaceInfo(AG).label+'\tScore',...rows].join('\n'),'Tabela copiada — cole no Excel'); }
  if(k==='pj'){ const tops=AG.top.slice().sort((a,b)=>b[1]-a[1]);
    copy(['Empresa\tCidade\tkW\tClasse\tAno\tModalidade\tSubgrupo',...tops.map(t=>[t[0],t[6][1]+'/'+t[6][2],t[1],CLASSES[t[2]],t[3],MODMAP[t[5]]||'',t[4]].join('\t'))].join('\n'),`${tops.length} empresas copiadas`); }
});

/* ================= presentation ================= */
let SL=[],si=0;
function buildSlides(){
  const A=AG,C=S.calc,co=calcOut(A),sp=spaceInfo(A),pb=payback(A),s=R[S.sel],nOn=LIST.filter(o=>o.on).length;
  const rk=LIST.filter(o=>o.on).sort((a,b)=>b.score-a.score).slice(0,6);
  const out=[];
  out.push({one:true,kick:'Mercado solar da região',title:`${esc(s[1])}/${s[2]}${nOn>1?` + ${nOn-1} cidades`:''}`,big:fmt(A.n),bigl:`usinas solares instaladas${S.cls.length<5?' · '+clsLabel():''}`,
    sup:[[kwpF(A.kw),'potência'],[fmt1(A.ritmo),'novas por mês'],[fmt(A.pop),'habitantes'],[S.radius?S.radius+' km':'—','raio']],say:`Dados públicos · ANEEL, IBGE e NASA · até ${mLabel(D.asOf)}`});
  const DG=diagnose(A),sl=sellInfo(A),LI=leadInfo(A);
  out.push({kick:'Termômetro do mercado',title:DG.V[1],big:DG.V[0],bigl:DG.V[2],chart:gaugesHtml(DG),say:'Verde = favorável · amarelo = atenção · vermelho = desfavorável'});
  out.push({kick:'O que ainda dá pra vender',title:`${fmt(sl.clients)} clientes ainda sem solar`,big:money(sl.tam),bigl:'em kits ainda por vender',sup:[[fmt(sl.soldYear),'vendidos em 12 meses'],[sl.years?'~'+fmt(sl.years)+' anos':'—','de mercado']],
    chart:`<div class="segs">${sl.seg.map(g=>`<div class="seg" style="grid-template-columns:150px 1fr 120px"><div class="sl">${g.icon} ${g.label}</div><div class="segbar"><i style="width:${g.tot?g.has/g.tot*100:0}%;background:#16130f"></i><i style="width:${g.tot?g.sem/g.tot*100:0}%;background:${g.color}"></i><span>${g.tot?pct(g.sem/g.tot,0):'—'} sem solar</span></div><div class="sv"><b>${money(g.val)}</b></div></div>`).join('')}</div>`,say:'Preto = já tem solar · colorido = ainda não tem.'});
  { const TI=targetInfo(A),rf=rfCalc(TI.T,TI.L);
    out.push({kick:'Plano de vendas · Funil Reverso',title:`${fmt(rf.leads)} leads/mês para ${fmt1(TI.T)} vendas`,big:rf.sdr+' SDR'+(rf.sdr>1?'s':''),bigl:'pré-vendedores necessários',chart:rfHtml(A,TI),say:'Começa pela meta e sobe até os leads.'});
    out.push({kick:'Como gerar os leads',title:'Sopa de canais',big:fmt(chPlan(A,TI.T,TI.L).reduce((s,c)=>s+(c.cont||0),0)),bigl:'contatos por mês em todos os canais',chart:channelsHtml(A,TI),say:'Nenhum canal sozinho sustenta a meta.'}); }
  if(HAS_CNPJ&&A.integ) out.push({one:true,kick:'Concorrência',title:`${fmt(A.integ)} empresas de energia solar na região`,big:fmt1(A.ritmo/A.integ),bigl:'vendas por mês, em média, por empresa',sup:[[fmt(A.n/A.integ),'usinas por empresa'],[fmt(A.integNew),'empresas abertas em 12 meses']],say:'Quem gera demanda própria vende acima da média.'});
  if(LI.show) out.push({kick:(LI.name||'Sua empresa')+' no mercado',title:`${pct(LI.shareSales,1)} das vendas da região`,big:pct(LI.shareBase,1),bigl:'da base instalada é sua',chart:leadViz(A),say:`O mercado atende ~<b>${fmt(LI.mktLeads)} leads/mês</b>.`});
  out.push({kick:'Base instalada',title:`${pct(A.n?A.old/A.n:0,0)} das usinas têm ${2026-S.oldY}+ anos`,big:fmt(A.old),bigl:`usinas conectadas até ${S.oldY}`,sup:[[fmt(A.n),'usinas na região']],
    chart:vbars(yearsItems(A),{h:240})+`<div class="legend"><span><i style="background:var(--s5)"></i>Até ${S.oldY}</span><span><i style="background:var(--s3)"></i>Até 2024</span><span><i style="background:var(--s2)"></i>2025–26</span></div>`,say:`Usina antiga sem acompanhamento = <b>cliente sem assistência</b>.`});
  out.push({kick:'Ritmo de venda',title:A.growth!=null&&A.growth<=-0.15?`Venda nova caiu ${pct(-A.growth,0)}`:'Novas usinas todo mês',big:fmt1(A.ritmo),bigl:'novas usinas por mês',
    sup:[[gtxt(A.growth),'em 12 meses'],[money(A.kw12*C.price),'venda nova / ano']],chart:vbars(monthsItems(A),{h:240,every:3}),say:A.growth!=null&&A.growth<=-0.15?`Menos venda nova → a receita vem <b>da base instalada</b>.`:`Cada venda nova é <b>mais um cliente para acompanhar</b>.`});
  out.push({kick:'Espaço de mercado',title:`${fmt(sp.n)} ${sp.label}`,big:sp.tot?pct(sp.has/sp.tot):'—',bigl:`das ${sp.seg} já têm solar`,sup:[[gtxt(A.popG),'população desde 2010']],chart:rings3(A),say:`O mercado está <b>longe de saturar</b>.`});
  out.push({kick:'Por que agora',title:'Conta subindo, Fio B aumentando',big:plusPct(A.reaj),bigl:'conta de luz em 12 meses',
    sup:[[pb.years?fmt1(pb.years)+' anos':'—','payback'],[fmt1(A.hsp),'kWh/m²/dia de sol']],chart:`<div class="vsub"><span>Fio B · Lei 14.300</span></div>${fioB()}`,say:`2026: <b>60%</b> do Fio B · 2028: <b>90%</b>.`});
  out.push({one:true,kick:'Monitoramento',title:'Usina parada é dinheiro perdido',big:money(A.econ),bigl:'de economia gerada por mês na região',sup:[[moneyFull(dayLossOf(A)),'por dia, usina média parada'],[money(A.econ*0.05),'/mês se 5% parar']],say:`Sem monitoramento, <b>ninguém vê a usina parada</b>.`});
  out.push({one:true,kick:'Receita de pós-venda',title:'Receita recorrente com a base',big:money(co.mrr),bigl:'por mês',sup:[[C.cap+'%','da base'],[fmt(co.cli),'clientes'],[moneyFull(C.ticket),'plano/mês'],[money(co.mrr*12+co.clean),'por ano']],say:`Cada <b>1% da base</b> = <b>${money(A.n/100*C.ticket)}/mês</b>.`});
  if(rk.length>1) out.push({kick:'Onde atacar',title:'Cidades prioritárias',big:esc((rk.find(o=>!o.sede)||rk[0]).r[1]),bigl:'maior oportunidade vizinha',chart:scoreTable(LIST,6),say:'Pontos por critério, comparando com a melhor cidade da região.'});
  if(false) out.push({kick:'Onde atacar',title:'Cidades prioritárias',big:esc((rk.find(o=>!o.sede)||rk[0]).r[1]),bigl:'maior oportunidade vizinha',chart:`<div class="ranks">${rk.map((o,i)=>`<div class="rrow" style="grid-template-columns:26px 150px 1fr"><span class="rn">${i+1}</span><span class="rc">${esc(o.r[1])}</span><div class="rt"><b style="width:${o.score}%"></b><span>${o.score}</span></div></div>`).join('')}</div>`,say:`Base instalada + ritmo + espaço livre.`});
  return out;
}
function drawSlide(){
  const s=SL[si],two=s.chart&&!s.one;
  $('slide').innerHTML=`<div class="sl-in ${two?'':'one'}"><div><div class="skick">${s.kick}</div><h2 class="stitle">${s.title}</h2><div class="sbig">${s.big}</div><div class="sbigl">${s.bigl}</div>
    ${s.sup?`<div class="ssup">${s.sup.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`:''}<div class="ssay">${s.say}</div></div>${two?`<div class="schart">${s.chart}</div>`:''}</div>`;
  $('shDots').innerHTML=SL.map((_,i)=>`<i class="${i===si?'on':''}" data-si="${i}"></i>`).join('');
}
function startShow(){ SL=buildSlides(); si=0; $('shArea').textContent=areaName(); $('show').classList.remove('hidden'); drawSlide(); try{ const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
function endShow(){ $('show').classList.add('hidden'); try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} }
const go=d=>{ si=clamp(si+d,0,SL.length-1); drawSlide(); };
$('shNext').onclick=()=>go(1); $('shPrev').onclick=()=>go(-1); $('shExit').onclick=endShow;
$('shDots').addEventListener('click',e=>{ const d=e.target.closest('[data-si]'); if(d){ si=+d.dataset.si; drawSlide(); } });
document.addEventListener('keydown',e=>{ if($('show').classList.contains('hidden')) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ go(1); e.preventDefault(); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ go(-1); e.preventDefault(); }
  if(e.key==='Escape') endShow(); });

/* ================= boot ================= */
drawPicker();
window.addEventListener('resize',()=>{ if(map) map.invalidateSize(); });
window.__mm={S,render,met,region,setPersona,R,get AG(){return AG;},get LIST(){return LIST;},buildSlides};
if(!readHash()) setTimeout(()=>$('pickInp').focus(),50);
lastHash=location.hash;
window.addEventListener('hashchange',()=>{ if(location.hash===lastHash) return; lastHash=location.hash; readHash(); });
})();
</script>
